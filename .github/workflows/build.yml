name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch: # Enables manually triggering the build

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the repository code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Set up Elan, download the correct Lean toolchain, and build the project
      - name: Build Lean Project
        uses: leanprover/lean-action@v1
